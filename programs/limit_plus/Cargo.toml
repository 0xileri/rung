[package]
name = "limit-plus"
version = "0.1.0"
description = "Limit+ — a capital-backed valuation market for PreStocks on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "limit_plus"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token_2022"] }
